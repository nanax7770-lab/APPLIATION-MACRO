<div id="app">
  <div class="boot" id="boot">Chargement…</div>

  <!-- ============ AUJOURD'HUI ============ -->
  <section class="page root active" data-page="today" data-title="Aujourd’hui">
    <header class="nav"><div class="nav-inner"><div></div><div class="nav-title" id="today-nav-title">Aujourd’hui</div><div class="nav-right"></div></div></header>
    <main class="scroll"><div id="today"></div></main>
  </section>

  <!-- ============ ALIMENTS ============ -->
  <section class="page root" data-page="foods" data-title="Aliments">
    <header class="nav"><div class="nav-inner"><div></div><div class="nav-title">Aliments</div><div class="nav-right"></div></div></header>
    <main class="scroll">
      <div class="lt"><h1 class="large-title">Aliments</h1></div>
      <label class="search">
        <svg class="ic"><use href="#i-search"/></svg>
        <input id="food-search" type="search" placeholder="Poulet, riz, avoine…" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <button class="search-clear" data-action="clear-food-search" hidden aria-label="Effacer"><svg class="ic"><use href="#i-x-circle"/></svg></button>
      </label>
      <div id="food-results" hidden></div>
      <div id="foods"></div>
    </main>
  </section>

  <!-- ============ PROGRÈS ============ -->
  <section class="page root" data-page="progress" data-title="Progrès">
    <header class="nav"><div class="nav-inner"><div></div><div class="nav-title">Progrès</div><div class="nav-right"></div></div></header>
    <main class="scroll">
      <div class="lt"><h1 class="large-title">Progrès</h1></div>
      <div id="progress"></div>
    </main>
  </section>

  <!-- ============ PROFIL ============ -->
  <section class="page root" data-page="profile" data-title="Profil">
    <header class="nav"><div class="nav-inner"><div></div><div class="nav-title">Profil</div><div class="nav-right"></div></div></header>
    <main class="scroll">
      <div class="lt"><h1 class="large-title">Profil</h1></div>
      <div id="profile"></div>
    </main>
  </section>

  <!-- ============ CATÉGORIE D'ALIMENTS ============ -->
  <section class="page pushed" data-page="cat" data-title="Catégorie">
    <header class="nav"><div class="nav-inner">
      <button class="nav-back" data-pop><svg class="ic"><use href="#i-chev-l"/></svg><span class="back-label">Aliments</span></button>
      <div class="nav-title" id="cat-nav-title"></div><div class="nav-right"></div>
    </div></header>
    <main class="scroll"><div id="cat"></div></main>
  </section>

  <!-- ============ RECETTE ============ -->
  <section class="page pushed" data-page="recipe" data-title="Recette">
    <header class="nav always"><div class="nav-inner">
      <button class="nav-back" data-action="recipe-back"><svg class="ic"><use href="#i-chev-l"/></svg><span class="back-label">Aliments</span></button>
      <div class="nav-title" id="recipe-nav-title">Recette</div>
      <div class="nav-right"><button class="nav-btn text" data-action="recipe-save">OK</button></div>
    </div></header>
    <main class="scroll"><div id="recipe"></div></main>
  </section>

  <!-- Barre d’onglets -->
  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="today"><svg class="ic"><use href="#i-target"/></svg><span>Aujourd’hui</span></button>
    <button class="tab" data-tab="foods"><svg class="ic"><use href="#i-apple"/></svg><span>Aliments</span></button>
    <button class="tab" data-tab="progress"><svg class="ic"><use href="#i-chart"/></svg><span>Progrès</span></button>
    <button class="tab" data-tab="profile"><svg class="ic"><use href="#i-user"/></svg><span>Profil</span></button>
  </nav>

  <div class="backdrop" id="backdrop"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  <div class="toast" id="toast" role="status"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
